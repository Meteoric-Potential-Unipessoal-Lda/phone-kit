<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phone-kit</title>
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--line:#E2E6EC;--ink:#111827;--muted:#4B5563;--soft:#6B7280;--blue:#1D4ED8;--blue2:#1E40AF;--blue-bg:#EEF2FF;--green:#12B76A;--green-ink:#05603A;--green-bg:#ECFDF3;--amber:#B54708;--amber-bg:#FFFAEB;--red:#B42318;--red-bg:#FEF3F2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:inherit;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;line-height:1.2}
h2{font-size:19px;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 240px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.brand b{display:block;font-size:18px;font-weight:800}
.brand span{font-size:13px;color:var(--muted)}
.chip{display:none;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:var(--green-bg);border:1px solid #ABEFC6;font-size:14px;font-weight:600;color:var(--green-ink)}
.chip.on{display:flex}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.langlbl{display:flex;align-items:center;gap:8px;font-size:14px;color:#374151}
select.lang{min-height:40px;padding:0 10px;border:1px solid #CBD2DC;border-radius:10px;background:#fff}
.layout{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:24px;padding-bottom:40px}
nav.side{flex:1 1 220px;max-width:100%;display:flex;flex-direction:column;gap:16px}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
#panel{display:flex;flex-direction:column;gap:20px}
#panel:empty,#qbox:empty{display:none}
.item .t1{display:block;font-weight:600}
.item .t2{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.steps{padding:10px}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--soft);font-weight:500}
.step .n{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#EEF1F5;color:var(--muted)}
.step.done{color:var(--ink)}
.step.done .n{background:var(--green);color:#fff}
.step.act{background:var(--blue-bg);color:var(--blue);font-weight:600}
.step.act .n{background:var(--blue);color:#fff}
.safe{display:flex;gap:10px;padding:0 6px;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;background:none}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}
.btn-ghost{background:#fff;border-color:#CBD2DC;color:#1F2937}.btn-ghost:hover{background:#F1F4F8}
.btn-danger{background:#fff;border-color:#F3C2BD;color:var(--red)}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.choice:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline}
.lead{font-size:16px;color:var(--muted);margin-top:8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid4{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choice{display:flex;flex-direction:column;gap:10px;text-align:left;padding:22px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer}
.choice:hover{border-color:#93B4FF;box-shadow:0 0 0 3px #E0E9FF}
.choice b{font-size:19px}
.choice span{color:var(--muted)}
.choice.main{border-color:#93B4FF;box-shadow:0 0 0 3px #E0E9FF}
.ico{width:44px;height:44px;border-radius:12px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;flex:none}
.pad{padding:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.input{min-height:46px;padding:0 14px;border:1px solid #CBD2DC;border-radius:10px;background:#fff;width:100%;max-width:420px;font-size:16px}
.digits{display:flex;gap:8px;flex-wrap:wrap}
.digit{width:46px;height:54px;text-align:center;font-size:22px;font-weight:700;border:1px solid #CBD2DC;border-radius:10px;background:#fff}
.note{display:flex;gap:8px;align-items:center;font-size:14px;border-radius:10px;padding:10px 12px}
.note.ok{color:var(--green-ink);background:var(--green-bg)}
.note.warn{color:var(--amber);background:var(--amber-bg)}
.note.bad{color:var(--red);background:var(--red-bg)}
.metric{padding:20px;display:flex;flex-direction:column;gap:10px}
.metric .lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.metric .val{font-size:28px;font-weight:800}
.bar{height:8px;border-radius:999px;background:#EEF1F5;overflow:hidden}
.bar>div{height:100%;border-radius:999px}
.sub{font-size:13px;color:var(--muted)}
.obs{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.approw{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 72px;gap:12px;align-items:center;font-size:14px;margin-top:10px}
.approw span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group{padding:8px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 6px}
.cnt{font-size:13px;font-weight:600;color:var(--blue);background:var(--blue-bg);padding:3px 9px;border-radius:999px}
.item{display:flex;align-items:flex-start;gap:14px;padding:12px 16px;border-radius:12px;cursor:pointer}
.item:hover{background:#F6F8FB}
.item.on{background:#F8FAFF}
.item input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue);flex:none;cursor:pointer}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{flex:none;align-self:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.off{background:#fff;color:var(--blue);border:1px solid #B2CCFF}
.sticky{position:sticky;bottom:16px;z-index:5}
.dock{background:#0F172A;color:#fff;border-radius:16px;padding:14px 16px 14px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;box-shadow:0 12px 32px rgba(15,23,42,.25)}
.dock .big{font-size:22px;font-weight:800}
.dock .s{font-size:14px;color:#CBD5E1}
.dock .s2{font-size:13px;color:#94A3B8}
.logline{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid #F0F2F5;font-size:14px;overflow-wrap:anywhere}
.logline:last-child{border-bottom:0}
.logline .k{flex:none;width:18px;text-align:center;font-weight:700}
.l-ok{color:var(--green-ink)}.l-warn{color:var(--amber)}.l-bad{color:var(--red)}.l-title{font-weight:700;color:var(--ink)}.l-say{color:#374151}.l-dim{color:var(--soft)}
.logbox{max-height:420px;overflow:auto;padding:4px 0}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid #DCE3EE;border-top-color:var(--blue);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;flex:none}
.banner{display:none;background:var(--red-bg);color:var(--red);border:1px solid #F3C2BD;border-radius:12px;padding:12px 16px;font-weight:600}
.banner.on{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CBD2DC;background:#fff;font-weight:600;cursor:pointer}
.chipbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#EEF1F5}
.stack>div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cmp{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cmp .v{font-size:22px;font-weight:800}
.cmp .v small{font-size:14px;font-weight:600;color:var(--muted)}
.good{color:var(--green-ink)}
.upd{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:var(--blue-bg);color:var(--blue);border:1px solid #B2CCFF;border-radius:12px;padding:10px 16px;font-weight:600}
.upd.on{display:flex}
@media (max-width:640px){.wrap{padding:0 16px}h1{font-size:24px}.layout{padding-top:16px}}
</style>
</head>
<body>
<script>
/* Старый браузер (Internet Explorer и т.п.): основной скрипт в нём не запустится — показать подсказку. Только ES5. */
(function(){
  var ok = !!(window.fetch && window.Promise && window.Symbol && Array.prototype.includes);
  if (ok) return;
  var M = {
    ru:'Этот браузер устарел, страница в нём не работает. Откройте этот же адрес в Chrome, Edge, Firefox или Яндекс.Браузере — или отвечайте в чёрном окне набора.',
    uk:'Цей браузер застарів, сторінка в ньому не працює. Відкрийте цю ж адресу в Chrome, Edge, Firefox — або відповідайте в чорному вікні набору.',
    en:'This browser is too old for this page. Open the same address in Chrome, Edge or Firefox, or answer in the black kit window.',
    pt:'Este navegador é demasiado antigo. Abra o mesmo endereço no Chrome, Edge ou Firefox, ou responda na janela preta do kit.',
    es:'Este navegador es demasiado antiguo. Abra la misma dirección en Chrome, Edge o Firefox, o responda en la ventana negra del kit.',
    fr:'Ce navigateur est trop ancien. Ouvrez la même adresse dans Chrome, Edge ou Firefox, ou répondez dans la fenêtre noire du kit.',
    it:'Questo browser è troppo vecchio. Apri lo stesso indirizzo in Chrome, Edge o Firefox, oppure rispondi nella finestra nera del kit.',
    de:'Dieser Browser ist zu alt. Öffnen Sie dieselbe Adresse in Chrome, Edge oder Firefox – oder antworten Sie im schwarzen Fenster des Kits.',
    lv:'Šis pārlūks ir pārāk vecs. Atveriet to pašu adresi Chrome, Edge vai Firefox, vai atbildiet rīka melnajā logā.',
    pl:'Ta przeglądarka jest za stara. Otwórz ten sam adres w Chrome, Edge lub Firefox albo odpowiadaj w czarnym oknie zestawu.'
  };
  var l = ((navigator.language || navigator.userLanguage || 'en') + '').substring(0, 2).toLowerCase();
  var t = M[l] || M.en;
  document.write('<style>body>*{display:none!important}body>div.oldb{display:block!important}</style><div class="oldb" style="max-width:640px;margin:40px auto;padding:20px;font:16px/1.5 Segoe UI,Arial,sans-serif;background:#FFFAEB;border:1px solid #B54708;color:#111827">' +
    '<b>phone-kit</b><br><br>' + t + '<br><br><code style="font-size:14px">' + location.href.replace(/</g, '&lt;') + '</code></div>');
  window.__oldBrowser = true;
})();
</script>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/><path d="M9.5 9.5l2 2 3.5-4"/></svg></div>
      <div><b>phone-kit</b><span data-t="ui_sub">Android</span></div>
    </div>
    <div class="chip" id="chip"><i></i><span id="chipText"></span></div>
    <label class="langlbl">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>
      <span data-t="ui_lang">Language</span>
      <select class="lang" id="lang">
        <option value="ru">Русский</option><option value="uk">Українська</option><option value="en">English</option>
        <option value="pt">Português</option><option value="es">Español</option><option value="fr">Français</option>
        <option value="it">Italiano</option><option value="de">Deutsch</option><option value="lv">Latviešu</option><option value="pl">Polski</option>
      </select>
    </label>
  </div>
</header>

<div class="wrap layout">
  <nav class="side" aria-label="steps">
    <div class="card steps" id="steps"></div>
    <div class="safe">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12B76A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9c-4-1.3-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span data-t="ui_safe"></span>
    </div>
    <div class="safe" style="font-size:12px;color:#6B7280"><span id="kitver"></span></div>
  </nav>
  <main>
    <div class="banner" id="offline" data-t="ui_offline" style="order:-2"></div>
    <div class="upd" id="upd" style="order:-2"><span id="updText"></span><a class="btn btn-primary btn-sm" id="updLink" target="_blank" rel="noopener noreferrer" href="#"></a></div>
    <div id="qbox"></div>
    <div id="panel"></div>
    <section class="card" id="logcard">
      <div class="ghead" style="padding:14px 18px">
        <h2 style="font-size:16px"><span data-t="ui_log">Log</span> <span class="cnt" id="logcnt">0</span></h2>
        <button type="button" class="btn btn-ghost btn-sm" id="logtoggle"></button>
      </div>
      <div class="logbox hidden" id="logbox" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';
  var TOKEN = (location.search.match(/[?&]t=([a-z0-9]+)/) || [])[1] || '';
  var S = { seq: 0, stage: 'start', mode: null, device: null, summary: null, progress: null, report: null, finished: false,
            q: null, qid: null, lang: 'ru', dict: {}, log: [], stageLogFrom: { connect: 0, run: 0, restore: 0, diag: 0 }, sel: {}, logOpen: false, sent: false, closed: false };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function T(k) { var a = arguments, s = S.dict[k] || FALLBACK[k] || k; return s.replace(/\{(\d+)\}/g, function (m, i) { return a[+i + 1] != null ? a[+i + 1] : m; }); }
  function api(path, body) {
    var url = path + (path.indexOf('?') < 0 ? '?' : '&') + 't=' + TOKEN;
    var opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    return fetch(url, opt).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  var FALLBACK = { ui_offline: 'No connection to phone-kit. Is its window closed?', ui_log: 'Log', ui_lang: 'Language' };
  var ICON = {
    wifi: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/></svg>',
    usb: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v13"/><path d="M8 6l4-4 4 4"/><rect x="8" y="15" width="8" height="7" rx="1.5"/></svg>',
    diag: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    opt: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
    undo: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
    mem: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
    phone: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
    check: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#12B76A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
    tick: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>'
  };

  // ---------------------------------------------------------------- language
  function loadLang(code) {
    return api('/api/lang?code=' + code).then(function (d) {
      S.dict = d || {}; S.lang = code; $('lang').value = code;
      document.documentElement.lang = code;
      var nodes = document.querySelectorAll('[data-t]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = T(nodes[i].getAttribute('data-t'));
      renderSteps(); renderPanel(); renderQuestion(true); renderLogToggle();
      if (S.update) { $('updText').textContent = T('ui_update', S.update.version); $('updLink').textContent = T('ui_update_btn'); }
    });
  }
  $('lang').addEventListener('change', function () { var c = this.value; api('/api/lang', { code: c }).then(function () { return loadLang(c); }).catch(function () {}); });

  // ---------------------------------------------------------------- steps
  function stepList() {
    if (S.mode === 'restore') return ['start', 'connect', 'restore', 'done'];
    if (S.mode === 'diag') return ['start', 'connect', 'diag', 'done'];
    return ['start', 'connect', 'diag', 'plan', 'run', 'done'];
  }
  function renderSteps() {
    var list = stepList(), cur = list.indexOf(S.stage), h = '';
    for (var i = 0; i < list.length; i++) {
      var cls = i < cur ? 'done' : (i === cur ? 'act' : '');
      if (S.stage === 'done' && i === cur) cls = 'done';
      h += '<div class="step ' + cls + '"' + (i === cur ? ' aria-current="step"' : '') + '><span class="n">' + (cls === 'done' ? '✓' : (i + 1)) + '</span><span>' + esc(T('ui_st_' + list[i])) + '</span></div>';
    }
    $('steps').innerHTML = h;
  }

  // ---------------------------------------------------------------- log
  var KMARK = { ok: '✓', warn: '!', bad: '×', title: '›', say: '' };
  function logClass(e) { if (e.k === 'say') return e.c === 'DarkGray' ? 'l-dim' : (e.c === 'Yellow' ? 'l-warn' : (e.c === 'Red' ? 'l-bad' : (e.c === 'Green' ? 'l-ok' : 'l-say'))); return 'l-' + e.k; }
  function logHtml(e) { return '<div class="logline ' + logClass(e) + '"><span class="k">' + (KMARK[e.k] || '') + '</span><span>' + esc(String(e.t).replace(/^\s+/, '')) + '</span></div>'; }
  function addLog(e) {
    if (!e.t || !String(e.t).trim()) return;
    S.log.push(e);
    var box = $('logbox'), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.insertAdjacentHTML('beforeend', logHtml(e));
    if (atEnd) box.scrollTop = box.scrollHeight;
    $('logcnt').textContent = S.log.length;
  }

        (S.mode === 'opt' && S.report.journal ? '<p class="sub" style="margin-top:6px">' + esc(T('ui_journal_n', S.report.journal)) + '</p>' : '') + '</div></div>' +
        compareHtml(S.compare) +
        (S.report.dest ? '<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:16px">' + esc(T('ui_copies')) + '</h2><p class="mono" style="overflow-wrap:anywhere">' + esc(S.report.dest) + '</p><p class="sub">' + esc(T('ui_copies_d')) + '</p></div>' : '') +
        (S.client ? '<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:16px">' + esc(T('ui_client')) + '</h2><p class="sub">' + esc(T('ui_client_d')) + '</p><div class="row"><a class="btn btn-primary" target="_blank" rel="noopener" href="/api/client?t=' + TOKEN + '&amp;r=' + S.seq + '">' + esc(T('ui_client')) + ' ↗</a></div></div>' : '') +
        '<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:16px">' + esc(T('ui_report')) + '</h2><p class="mono" style="overflow-wrap:anywhere">' + esc(S.report.zip) + '</p><p class="sub">' + esc(T('ui_report_d')) + '</p>' +
        (S.finished ? '<div class="row"><button type="button" class="btn btn-primary" id="closebtn">' + esc(T('ui_close')) + '</button></div>' : '') + '</div>';
      h = dh + h;
    } else if (S.finished && !S.q) {
      h = '<div class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2>' + esc(T('ui_finished')) + '</h2><div class="row"><button type="button" class="btn btn-primary" id="closebtn">' + esc(T('ui_close')) + '</button></div></div>' + h;
    }
    if (hideOnQuestion) h = '';
    p.innerHTML = h;
    var cb = $('closebtn'); if (cb) cb.onclick = function () { api('/api/close', {}).catch(function () {}); S.closed = true; renderPanel(); };
  }
  function diagHtml(s) {
    var red = '#D92D20', amber = '#F79009', green = '#12B76A';
    var memPct = s.memTotalMb ? Math.round((1 - s.memAvailMb / s.memTotalMb) * 100) : 0;
    var h = '<div style="display:flex;flex-direction:column;gap:20px"><div><h1>' + esc(T('ui_diag_t')) + '</h1><p class="lead">' + esc([s.brand + ' ' + s.model, 'Android ' + s.android, s.skin].filter(Boolean).join(' · ')) + ' · ' + esc(T('ui_ro')) + '</p></div><div class="grid4">';
    h += '<div class="card metric"><div class="lbl">' + esc(T('ui_storage')) + '</div><div class="val" style="color:' + (s.dataPct >= 90 ? 'var(--red)' : 'var(--ink)') + '">' + s.dataPct + '%</div>' + bar(s.dataPct, s.dataPct >= 90 ? red : (s.dataPct >= 80 ? amber : green)) + '<div class="sub">' + esc(T('ui_free_of', gb(s.dataFreeMb), gb(s.dataTotalMb))) + '</div></div>';
    h += '<div class="card metric"><div class="lbl">' + esc(T('ui_ram')) + '</div><div class="val">' + gb(s.memAvailMb) + ' ' + esc(T('ui_gb')) + '</div>' + bar(memPct, memPct >= 80 ? red : (memPct >= 65 ? amber : green)) + '<div class="sub">' + esc(T('ui_ram_free', gb(s.memTotalMb))) + '</div></div>';
    h += '<div class="card metric"><div class="lbl">' + esc(T('ui_bat')) + '</div><div class="val">' + esc(s.bat) + '%</div>' + bar(+s.bat || 0, (+s.bat || 0) < 20 ? red : green) + '<div class="sub">' + esc(String(s.batTemp).replace('.', (1.5).toLocaleString(S.lang).charAt(1))) + ' °C</div></div>';
    h += '<div class="card metric"><div class="lbl">' + esc(T('ui_up')) + '</div><div class="val">' + esc(T('ui_days', s.upDays)) + '</div>' + bar(Math.min(100, s.upDays / 14 * 100), s.upDays >= 14 ? amber : green) + '<div class="sub">' + esc(T('ui_up_d')) + '</div></div></div>';
    h += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="card pad"><h2 style="font-size:18px">' + esc(T('ui_obs')) + '</h2>';
    var obs = s.obs || [];
    if (!obs.length) h += '<p style="margin-top:12px;color:var(--muted)">' + esc(T('ui_noobs')) + '</p>';
    for (var i = 0; i < obs.length; i++) h += '<div class="obs"><span class="dot" style="background:' + (i === 0 ? red : (i < 3 ? amber : '#98A2B3')) + '"></span><span>' + esc(obs[i]) + '</span></div>';
    h += '</div><div class="card pad"><h2 style="font-size:18px">' + esc(T('ui_apps')) + '</h2>';
    var apps = s.apps || [], mx = apps.length ? apps[0].min : 1;
    for (var j = 0; j < apps.length; j++) h += '<div class="approw"><span class="mono" title="' + esc(apps[j].pkg) + '">' + esc(apps[j].pkg) + '</span>' + bar(apps[j].min / mx * 100, 'var(--blue)') + '<span style="text-align:right;color:var(--muted)">' + esc(dur(apps[j].min)) + '</span></div>';
    h += '</div></div>';
    if (s.susp && s.susp.length) {
      h += '<div class="card pad"><h2 style="font-size:18px">' + esc(T('ui_susp')) + '</h2>';
      for (var k = 0; k < s.susp.length; k++) h += '<div class="obs"><span class="dot" style="background:' + red + '"></span><span><b class="mono">' + esc(s.susp[k].pkg) + '</b> — ' + esc(s.susp[k].why) + '</span></div>';
      h += '</div>';
    }
    h += storageHtml(s.storage) + batteryHtml(s.battery);
    if (S.mode === 'opt' && S.stage === 'diag') h += '<div class="note ok">' + ICON.tick + '<span>' + esc(T('ui_cand', s.cand, s.candAuto)) + ' ' + esc(T('ui_to_plan')) + '</span></div>';
    return h + '</div>';
  }

  function fmtMb(mb) { return mb >= 1024 ? gb(mb) + ' ' + T('ui_gb') : Math.round(mb) + ' ' + T('s011').replace('{0}', '').trim(); }
  var CATS = [['Photos', 's021', '#1D4ED8'], ['Videos', 's022', '#7C3AED'], ['Audio', 's023', '#0891B2'], ['Downloads', 's024', '#F79009'], ['App', 's025', '#12B76A'], ['App Data', 's026', '#65A30D'], ['App Cache', 's027', '#D92D20'], ['System', 's028', '#667085'], ['Other', 's029', '#98A2B3']];
  function storageHtml(st) {
    if (!st || (!st.cat && !(st.dirs || []).length)) return '';
    var cat = st.cat || {}, tot = 0, i, h = '<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:18px">' + esc(T('ui_storage_t')) + '</h2>';
    for (i = 0; i < CATS.length; i++) tot += +cat[CATS[i][0]] || 0;
    if (tot > 0) {
      var bars = '', leg = '';
      for (i = 0; i < CATS.length; i++) { var v = +cat[CATS[i][0]] || 0; if (!v) continue; bars += '<div title="' + esc(T(CATS[i][1])) + '" style="width:' + (v / tot * 100) + '%;background:' + CATS[i][2] + '"></div>'; leg += '<span><i style="background:' + CATS[i][2] + '"></i>' + esc(T(CATS[i][1])) + ' · ' + esc(fmtMb(v)) + '</span>'; }
      h += '<div class="stack">' + bars + '</div><div class="legend">' + leg + '</div>';
    }
    var dirs = st.dirs || [];
    if (dirs.length) { h += '<div class="legend" style="margin-top:0">'; for (i = 0; i < dirs.length; i++) h += '<span><b>' + esc(dirs[i].name) + '</b> · ' + esc(fmtMb(dirs[i].mb)) + '</span>'; h += '</div>'; }
    var tips = st.tips || [];
    if (tips.length) { h += '<h3 style="font-size:15px;margin-top:4px">' + esc(T('ui_tips')) + '</h3>'; for (i = 0; i < tips.length; i++) h += '<div class="obs" style="margin-top:4px"><span class="dot" style="background:var(--blue)"></span><span>' + esc(tips[i]) + '</span></div>'; }
    return h + '</div>';
  }
  function batteryHtml(b) {
    if (!b) return '';
    var apps = b.apps || [], h = '<div class="card pad"><h2 style="font-size:18px">' + esc(T('ui_bat_t')) + '</h2>' + (b.since ? '<p class="sub" style="margin-top:4px">' + esc(T('ui_bat_since', b.since)) + '</p>' : '');
    if (!apps.length) return h + '<p style="margin-top:10px;color:var(--muted)">' + esc(T('ui_bat_none')) + '</p></div>';
    for (var i = 0; i < apps.length; i++) h += '<div class="approw"><span class="mono" title="' + esc(apps[i].pkg) + '">' + esc(apps[i].pkg) + '</span>' + bar(apps[i].pct, i === 0 && apps[i].pct >= 25 ? '#F79009' : 'var(--blue)') + '<span style="text-align:right;color:var(--muted)">' + esc(apps[i].pct) + '%</span></div>';
    return h + '</div>';
  }
  function compareHtml(c) {
    if (!c || !c.before || !c.after) return '';
    var b = c.before, a = c.after;
    var rows = [['c003', fmtMb(b.memAvailMb), fmtMb(a.memAvailMb), a.memAvailMb > b.memAvailMb], ['c004', b.procs, a.procs, a.procs < b.procs], ['c005', fmtMb(b.dataFreeMb), fmtMb(a.dataFreeMb), a.dataFreeMb > b.dataFreeMb], ['c006', b.disabled, a.disabled, a.disabled > b.disabled]];
    var h = '<div class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2 style="font-size:18px">' + esc(T('ui_cmp_t')) + ' <span class="sub" style="font-weight:500">· ' + esc(T(c.reboot ? 'ui_cmp_reboot' : 'ui_cmp_now')) + '</span></h2><div class="cmp">';
    for (var i = 0; i < rows.length; i++) h += '<div><div class="sub">' + esc(T(rows[i][0])) + '</div><div class="v"><small>' + esc(rows[i][1]) + ' →</small> <span class="' + (rows[i][3] ? 'good' : '') + '">' + esc(rows[i][2]) + '</span></div></div>';
    return h + '</div></div>';
  }

  // ---------------------------------------------------------------- events & polling
  function apply(ev) {
    var d = ev.data || {};
    if (ev.type === 'log') addLog(d);
    else if (ev.type === 'stage') { S.stage = d.s; if (d.mode) S.mode = d.mode; if (S.stageLogFrom[d.s] !== undefined) S.stageLogFrom[d.s] = S.log.length; if (d.s === 'run') S.progress = null; }
    else if (ev.type === 'device') { S.device = d; $('chipText').textContent = d.model + ' · ' + T(d.wifi ? 'ui_wifi' : 'ui_usb'); $('chip').classList.add('on'); }
    else if (ev.type === 'summary') S.summary = d;
    else if (ev.type === 'progress') S.progress = d;
    else if (ev.type === 'report') { S.report = d; if (d.mode) S.mode = d.mode; }
    else if (ev.type === 'finished') S.finished = true;
    else if (ev.type === 'compare') S.compare = d;
    else if (ev.type === 'client') S.client = d;
    else if (ev.type === 'update') { S.update = d; $('updText').textContent = T('ui_update', d.version); $('updLink').textContent = T('ui_update_btn'); $('updLink').href = /^https:\/\/github\.com\//.test(d.url) ? d.url : 'https://github.com/Meteoric-Potential-Unipessoal-Lda/phone-kit/releases/latest'; $('upd').classList.add('on'); }
  }
  var failures = 0, first = true;
  function poll() {
    api('/api/state?since=' + S.seq).then(function (st) {
      failures = 0; $('offline').classList.remove('on');
      if (first) { first = false; $('kitver').textContent = 'phone-kit ' + st.kit; if (st.lang && st.lang !== S.lang) loadLang(st.lang); }
      var changed = false;
      for (var i = 0; i < st.events.length; i++) { apply(st.events[i]); if (st.events[i].type !== 'log' || S.stage === 'connect' || S.stage === 'run' || S.stage === 'restore' || (S.stage === 'diag' && !S.summary)) changed = true; }
      S.seq = st.seq;
      if (st.finished) S.finished = true;
      var nq = st.question || null, qchanged = (nq ? nq.id : null) !== (S.q ? S.q.id : null);
      S.q = nq;
      if (qchanged) { if (!nq) S.qid = null; renderQuestion(false); changed = true; }
      if (changed) { renderSteps(); renderPanel(); }
    }).catch(function () {
      if (++failures >= 4 && !S.closed) $('offline').classList.add('on');
    }).then(function () { if (!S.closed) setTimeout(poll, S.q ? 600 : 400); });
  }

  renderLogToggle();
  api('/api/state?since=0').then(function (st) { return loadLang(st.lang || 'en'); }).catch(function () { $('offline').classList.add('on'); }).then(poll);
})();
</script>
</body>
</html>
