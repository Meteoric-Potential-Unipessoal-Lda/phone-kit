name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scenarios:
    name: Сценарии на подставном adb (pwsh 7, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -v && python3 --version
      - run: bash tests/run.sh

  windows-ps51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Кодировки (BOM + CRLF, .bat — ASCII, start.command — LF)
        shell: powershell
        # Встроенный код раннер сохраняет без BOM, PowerShell 5.1 читает его как ANSI — только латиница.
        run: |
          $b = [IO.File]::ReadAllBytes("$PWD\phonekit.ps1")
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { throw 'phonekit.ps1: no UTF-8 BOM' }
          $t = [IO.File]::ReadAllText("$PWD\phonekit.ps1")
          if (($t -replace "`r`n", '') -match "`n") { throw 'phonekit.ps1: line endings must be CRLF' }
          foreach ($f in 'start.bat', 'prepare.bat') { if ([IO.File]::ReadAllBytes("$PWD\$f") | Where-Object { $_ -gt 127 }) { throw "${f}: must be ASCII" } }
          if ([IO.File]::ReadAllText("$PWD\start.command") -match "`r") { throw 'start.command: line endings must be LF' }
          'ok'
      - name: Разбор phonekit.ps1 в Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\phonekit.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'ok'
      - name: Пункт U (кабель) на подставных данных
        shell: powershell
        run: .\tests\usbtest.ps1
      - name: Веб-интерфейс в Windows PowerShell 5.1
        shell: pwsh
        run: python tests/webtest.py powershell
      - name: Кнопка «Обновить» (самообновление) в Windows PowerShell 5.1
        shell: pwsh
        run: python tests/updtest.py powershell

  mobile:
    name: phone-kit Mobile (бета) — тесты и сборка APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Логика, протокол ADB, сопряжение по коду, TLS
        run: |
          java -version
          CV=2.5.2; J="$RUNNER_TEMP/conscrypt-openjdk-uber-$CV.jar"; U="https://repo1.maven.org/maven2/org/conscrypt/conscrypt-openjdk-uber/$CV/conscrypt-openjdk-uber-$CV.jar"
          curl -fsSL -o "$J" "$U"; [ "$(curl -fsSL "$U.sha1" | cut -c1-40)" = "$(sha1sum "$J" | cut -c1-40)" ] || { echo "conscrypt sha1 mismatch"; exit 1; }
          CONSCRYPT_JAR="$J" bash tests/mobile/run.sh
      - name: Сборка APK
        env:
          KS_B64: ${{ secrets.PHONEKIT_KEYSTORE_B64 }}
          PHONEKIT_KS_PASS: ${{ secrets.PHONEKIT_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"; export PHONEKIT_KEYSTORE="$RUNNER_TEMP/ks.p12"; fi
          VER="$(sed -n 's/.*String VERSION = "\([^"]*\)".*/\1/p' mobile/src/net/zherdyev/phonekit/Engine.java)"
          echo "VER=$VER" >> "$GITHUB_ENV"
          bash mobile/build.sh "$PWD/out/phone-kit-mobile-$VER.apk"
          sha256sum "out/phone-kit-mobile-$VER.apk" | tee out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phone-kit-mobile
          path: out/phone-kit-mobile-*.apk
      - name: Черновик пре-релиза mobile-v<версия> (публикует владелец)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-v$VER"
          D="$(gh release list --limit 100 --json tagName,isDraft -q ".[] | select(.tagName==\"$TAG\") | .isDraft")"
          if [ "$D" = "false" ]; then echo "$TAG уже опубликован — не трогаю"; exit 0; fi
          if [ "$D" = "true" ]; then gh release delete "$TAG" --yes; fi
          SUM="$(cut -c1-64 out/sha256.txt)"
          python3 mobile/release_notes.py "$SUM" "$VER" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "out/phone-kit-mobile-$VER.apk" --draft --prerelease --target "$GITHUB_SHA" \
            --title "phone-kit Mobile $VER — чистка телефона без компьютера (Android 11+)" --notes-file "$RUNNER_TEMP/notes.md"

  mobile-emulator:
    name: phone-kit Mobile на эмуляторе (Android ${{ matrix.api }})
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phone-kit-mobile
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Установка и запуск
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/mobile/emu.sh out/emu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-${{ matrix.api }}
          path: out/emu

  kit-release:
    name: Черновик релиза набора (phone-kit-<версия>.zip)
    needs: [scenarios, windows-ps51]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Архив и черновик (публикует владелец)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(sed -n "s/^\$KitVersion = '\([0-9.]*\)'.*/\1/p" phonekit.ps1 | head -1)"
          [ -n "$V" ] || { echo "нет \$KitVersion"; exit 1; }
          TAG="v$V"
          D="$(gh release list --limit 100 --json tagName,isDraft -q ".[] | select(.tagName==\"$TAG\") | .isDraft")"
          if [ "$D" = "false" ]; then echo "$TAG уже опубликован — не трогаю"; exit 0; fi
          if [ "$D" = "true" ]; then gh release delete "$TAG" --yes; fi
          python3 dev/build_kit_zip.py "out/phone-kit-$V.zip"
          SUM="$(sha256sum "out/phone-kit-$V.zip" | cut -c1-64)"; echo "SHA-256 $SUM"
          python3 dev/kit_release.py notes "$V" "$SUM" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "out/phone-kit-$V.zip" --draft --target "$GITHUB_SHA" \
            --title "$(python3 dev/kit_release.py title "$V")" --notes-file "$RUNNER_TEMP/notes.md"
