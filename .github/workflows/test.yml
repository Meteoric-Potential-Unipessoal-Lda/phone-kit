name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scenarios:
    name: Сценарии на подставном adb (pwsh 7, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -v && python3 --version
      - run: bash tests/run.sh

  windows-ps51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Кодировки (BOM + CRLF, .bat — ASCII, start.command — LF)
        shell: powershell
        # Встроенный код раннер сохраняет без BOM, PowerShell 5.1 читает его как ANSI — только латиница.
        run: |
          $b = [IO.File]::ReadAllBytes("$PWD\phonekit.ps1")
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { throw 'phonekit.ps1: no UTF-8 BOM' }
          $t = [IO.File]::ReadAllText("$PWD\phonekit.ps1")
          if (($t -replace "`r`n", '') -match "`n") { throw 'phonekit.ps1: line endings must be CRLF' }
          foreach ($f in 'start.bat', 'prepare.bat') { if ([IO.File]::ReadAllBytes("$PWD\$f") | Where-Object { $_ -gt 127 }) { throw "${f}: must be ASCII" } }
          if ([IO.File]::ReadAllText("$PWD\start.command") -match "`r") { throw 'start.command: line endings must be LF' }
          'ok'
      - name: Разбор phonekit.ps1 в Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\phonekit.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'ok'
      - name: Пункт U (кабель) на подставных данных
        shell: powershell
        run: .\tests\usbtest.ps1
      - name: Веб-интерфейс в Windows PowerShell 5.1
        shell: pwsh
        run: python tests/webtest.py powershell
      - name: Кнопка «Обновить» (самообновление) в Windows PowerShell 5.1
        shell: pwsh
        run: python tests/updtest.py powershell
